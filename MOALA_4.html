<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ぴあチケット作成</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Roboto","Helvetica Neue","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 16px 50px}.hero,.card{background:#fff;border-radius:12px;box-shadow:0 4px 18px #00000012}.hero{padding:22px}.hero small{color:#71767b;font-weight:700}.hero h1{font-size:24px;margin:4px 0 5px}.hero p{margin:0;color:#656b70;font-size:13px}.card{padding:18px;margin-top:14px}.card h2{font-size:16px;margin:0 0 14px;border-left:4px solid #1e1f20;padding-left:9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#5f6368}input,textarea{width:100%;border:1px solid #cfd3d7;border-radius:5px;padding:11px;font:inherit;background:#fff}textarea{height:68px;resize:vertical}.submit{position:sticky;bottom:0;padding:16px 0;background:linear-gradient(transparent,#f3f4f6 34%)}button{width:100%;height:52px;border:0;border-radius:5px;background:#1e1f20;color:#fff;font-size:15px;font-weight:700}.image-drop{border:2px dashed #cfd3d7;border-radius:8px;padding:14px;text-align:center;background:#fafafa;cursor:pointer}.image-drop.drag{border-color:#1e1f20;background:#f0f1f2}.image-drop input{margin-top:8px}.image-preview{display:none;width:100%;max-height:210px;object-fit:contain;background:#eee;margin-top:10px;border-radius:5px}.image-help{font-size:11px;color:#71767b;line-height:1.5;margin-top:6px}.note{margin-top:12px;padding:10px;border:1px solid #f0cb75;background:#fff8df;color:#795d20;border-radius:6px;font-size:11px;line-height:1.6}@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="wrap"><section class="hero"><h1>ぴあチケット入力</h1><p>入力内容をMOALA_5.htmlへ渡します。</p></section><form id="form"><section class="card"><h2>公演情報</h2><div class="grid"><div class="full"><label>公演名</label><textarea id="title">うんこミュージアム　ＴＯＫＹＯ</textarea></div><div><label>公演日</label><input id="date" value="2026/8/6（木）"></div><div><label>開場時間（任意）</label><input id="open" value=""></div><div><label>開演時間（任意）</label><input id="start" value="13:30"></div><div class="full"><label>会場</label><input id="venue" value="ダイバーシティ東京　プラザ２Ｆ（東京都）"></div></div></section><section class="card"><h2>チケット情報</h2><div class="grid"><div><label>券種</label><input id="type" value="小人（３歳以上）"></div><div><label>座席・整理番号（任意）</label><input id="seat" value=""></div><div><label>所有者</label><input id="name" value="増田佑亮"></div><div><label>フリガナ</label><input id="kana" value="マスダユウスケ"></div><div class="full"><label>券面画像（イベント画像と同じように毎回追加）</label><div class="image-drop" id="imageDrop">画像をここへドラッグ・貼り付け、またはファイルを選択<input id="coverFile" type="file" accept="image/png,image/jpeg,image/webp"><img id="coverPreview" class="image-preview" alt="券面画像プレビュー"><div class="image-help">PNG・JPEG・WebP対応。選択した画像はこのタブ用に一時保存して券面画面へ渡します。</div></div></div><div class="full"><label>券面画像URL（任意。ファイルを選んだ場合はファイルを優先）</label><input id="cover" value="" placeholder="https://... または images/ticket-cover.png"></div></div></section><div class="submit"><button>チケット画面を表示</button></div></form></main><script>
let selectedCover='';
const fileInput=document.getElementById('coverFile'),preview=document.getElementById('coverPreview'),drop=document.getElementById('imageDrop');
function readCover(file){if(!file||!file.type.startsWith('image/'))return;const r=new FileReader();r.onload=()=>{selectedCover=r.result;preview.src=selectedCover;preview.style.display='block'};r.readAsDataURL(file)}
fileInput.addEventListener('change',()=>readCover(fileInput.files[0]));
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag')});
drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('drag');readCover(e.dataTransfer.files[0])});
document.addEventListener('paste',e=>{for(const item of e.clipboardData?.items||[]){if(item.type.startsWith('image/')){readCover(item.getAsFile());break}}});
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const q=new URLSearchParams();['title','date','open','start','venue','type','seat','name','kana','cover'].forEach(id=>q.set(id,document.getElementById(id).value));if(selectedCover){const imageKey='ticketCover:'+Date.now()+':'+Math.random().toString(36).slice(2);try{sessionStorage.setItem(imageKey,selectedCover);q.set('coverKey',imageKey)}catch(err){alert('画像を一時保存できませんでした。画像サイズを小さくしてください。');return}}location.href='MOALA_5.html?'+q.toString()});
</script></body></html>
