.trace-screen.show{display:flex;flex-direction:column}.trace-head{height:47px;flex:0 0 47px;background:transparent;color:#fff;position:relative;display:flex;align-items:center;justify-content:center;font-family:"Roboto",sans-serif;font-size:17px;font-weight:400;line-height:47px;-webkit-font-smoothing:antialiased}.trace-close{position:absolute;left:0;top:0;width:47px;height:47px;border:0;background:transparent;color:#fff;font-size:29px;font-weight:200;line-height:47px}.trace-demo{position:absolute;right:8px;top:6px;font-size:8px;color:#fff;background:#9b1c31;padding:2px 5px;border-radius:2px}.trace-body{position:relative;flex:1;min-height:0;padding:18px 16px 18px;overflow:hidden;background:#fff;border-radius:6px;margin-top:-8px;box-shadow:0 6px 10px rgba(0,0,0,.16),0 16px 24px rgba(0,0,0,.12);isolation:isolate}.trace-count{height:22px;display:flex;align-items:center;justify-content:flex-end;font-size:13px;color:#45484a}.trace-check{width:13px;height:13px;border-radius:50%;background:#62c96b;color:#fff;display:inline-grid;place-items:center;margin-right:4px;font-size:9px}.trace-rule{height:1px;background:#d8d8d8;margin:0 -3px 10px}.trace-title{font-family:"Roboto",sans-serif;font-size:14px;font-weight:700;line-height:1.3}.trace-meta{display:flex;flex-wrap:wrap;align-items:center;margin-top:4px;font-family:"Roboto",sans-serif;font-size:12px;line-height:1.7}.trace-time-label{margin-left:10px;margin-right:8px}.trace-type{margin-top:8px;font-family:"Roboto",sans-serif;font-size:18px;font-weight:700;line-height:1.3}.trace-guide-wrap{position:absolute;left:0;right:0;bottom:4%;display:flex;justify-content:center;align-items:center}.trace-guide{position:relative;width:min(84vw,calc(100vh - 180px),380px);height:min(84vw,calc(100vh - 180px),380px);border:1px dashed rgba(30,31,32,.3);border-radius:50%;background:rgba(255,255,255,.7);touch-action:none;display:grid;place-items:center}.trace-copy{width:88%;font-size:13px;font-weight:700;line-height:1.5;text-align:center;color:#4548 le" id="title"></h1><div class="datetime"><span id="date"></span><span class="time-group" id="openGroup"><span class="badge">開場時間</span><span id="open"></span></span><span class="time-group" id="startGroup"><span class="badge">開演時間</span><span id="start"></span></span></div><div class="venue" id="venue"></div></section><section class="block"><div class="type" id="type"></div><div class="seat" id="seat"></div></section><div class="rule"></div><section class="block"><div class="owner-label">所有者</div><div class="owner-line"><span class="owner-name" id="name"></span><span class="owner-kana" id="kana"></span></div></section></div><div class="entered-view"><img id="stampImage" class="stamp-uploaded" alt="使用済みスタンプ画像"><div class="thankyou" id="stampFallback"><div class="thank-band">THANK YOU</div></div><div class="used-at">チケット使用日時<br><span id="usedAt"></span></div></div><footer class="footer"><button class="present" id="present">チケットを提示</button></footer></section></div></main><div class="trace-screen" id="traceScreen" aria-hidden="true"><header class="trace-head"><button class="trace-close" id="traceClose" aria-label="閉じる">×</button><span>チケットを提示</span></header><main class="trace-body"><div class="trace-count"><span class="trace-check">✓</span>使用済みチケット：0 / 1</div><div class="trace-rule"></div><div class="trace-title" id="traceTitle"></div><div class="trace-meta"><span id="traceDate"></span><span class="trace-time-group" id="traceOpenGroup"><span class="trace-time-label">開場時間</span><span id="traceOpen"></span></span><span class="trace-time-group" id="traceStartGroup"><span class="trace-time-label">開演時間</span><span id="traceStart"></span></span></div><div class="trace-type" id="traceType"></div><div class="trace-guide-wrap"><div class="trace-guide" id="traceGuide"><div class="trace-copy">こちらの画面をスタッフにご提示ください。<br>※スクリーンショットはご利用いただけません。</div></div></div></main></div><div class="modal" id="modal"><div class="dialog"><div class="ticket-icon"><img src="plucked-ticket.png" alt="チケットアイコン"></div><h2>チケットを使用済みにしますか？</h2><p>この操作は元に戻せません。<br>入場時のご使用はお控えください。</p><div class="buttons"><button class="cancel" id="cancel">キャンセル</button><button class="use" id="use">使用済みにする</button></div></div></div><script>const p=new URLSearchParams(location.search),g=(k,d)=>p.get(k)||d;const data={title:g('title','うんこミュージアム　ＴＯＫＹＯ'),date:g('date','2026/8/6（木）'),open:'',start:g('start','13:30'),venue:g('venue','ダイバーシティ東京　プラザ２Ｆ（東京都）'),type:g('type','小人（３歳以上）'),seat:g('seat',''),name:g('name','増田佑亮'),kana:g('kana','マスダユウスケ'),cover:g('cover',''),coverKey:g('coverKey',''),stamp:g('stamp','1_r.png'),stampKey:g('stampKey','')};['title','date','open','start','venue','type','seat','name'].forEach(k=>document.getElementById(k).textContent=data[k]);document.getElementById('kana').textContent=data.kana?'（'+data.kana+'）':'';data.open=p.get('open')||'';data.start=p.has('start')?(p.get('start')||''):data.start;document.getElementById('open').textContent=data.open;document.getElementById('start').textContent=data.start;document.getElementById('openGroup').style.display=data.open?'inline-flex':'none';document.getElementById('startGroup').style.display=data.start?'inline-flex':'none';document.querySelector('.datetime').classList.toggle('both-times',Boolean(data.open&&data.start));let coverSource=data.cover;if(data.coverKey){try{coverSource=sessionStorage.getItem(data.coverKey)||coverSource}catch(e){}}if(coverSource){const c=document.getElementById('cover'),ci=document.getElementById('coverImage');ci.src=coverSource;ci.style.display='block';c.style.minHeight='0';c.querySelector('.poly').style.display='none';c.querySelector('.ticket-word').style.display='none';c.querySelector('.powered').style.display='none'}let stampSource=data.stamp;if(data.stampKey){try{stampSource=sessionStorage.getItem(data.stampKey)||stampSource}catch(e){}}if(stampSource){const img=document.getElementById('stampImage');img.src=stampSource;img.style.display='block';document.getElementById('stampFallback').style.display='none'}const key='moalaEntered:'+data.title+':'+data.date+':'+data.name;const scrollKey=key+':scroll';const ticket=document.getElementById('ticket'),modal=document.getElementById('modal');function syncEnteredTop(){const cover=document.getElementById('cover'),entered=document.querySelector('.entered-view'),blocks=document.querySelectorAll('.scroll > .block');if(cover&&entered){let top=cover.offsetHeight;blocks.forEach((b,i)=>{if(i<1)top+=b.offsetHeight});top-=20;const stamp=document.getElementById('stampImage'),fallback=document.getElementById('stampFallback'),used=document.querySelector('.used-at');const stampHeight=(stamp&&stamp.style.display!=='none'?(stamp.naturalHeight&&stamp.naturalWidth?Math.min(250,stamp.naturalHeight*(Math.min(ticket.clientWidth*.72,250)/stamp.naturalWidth)):220):(fallback?fallback.offsetHeight:220));const maxTop=Math.max(0,ticket.clientHeight-(used?used.offsetHeight:76)-stampHeight-14);entered.style.setProperty('--stamp-top',(Math.min(top,maxTop)+50)+'px')}}function render(t){syncEnteredTop();ticket.classList.add('entered');document.getElementById('usedAt').textContent=t}window.addEventListener('resize',()=>{if(ticket.classList.contains('entered'))syncEnteredTop()});const coverImage=document.getElementById('coverImage');if(coverImage)coverImage.addEventListener('load',()=>{requestAnimationFrame(()=>{if(ticket.classList.contains('entered'))syncEnteredTop();if(typeof restoreScroll==='function')restoreScroll()})});try{const s=JSON.parse(sessionStorage.getItem(key)||'null');if(s?.done)render(s.time)}catch(e){}function restoreScroll(){try{const sv=sessionStorage.getItem(scrollKey),sc=document.querySelector('.scroll');if(sv!==null&&sc)sc.scrollTop=parseInt(sv,10)||0}catch(e){}}requestAnimationFrame(()=>requestAnimationFrame(()=>{if(ticket.classList.contains('entered'))syncEnteredTop();restoreScroll()}));const sc=document.querySelector('.scroll');if(sc)sc.addEventListener('scroll',()=>{try{sessionStorage.setItem(scrollKey,String(sc.scrollTop))}catch(e){}});document.getElementById('cancel').onclick=()=>modal.classList.remove('show');document.getElementById('use').onclick=()=>{const n=new Date(),t=n.getFullYear()+'/'+String(n.getMonth()+1).padStart(2,'0')+'/'+String(n.getDate()).padStart(2,'0')+' '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0');try{sessionStorage.setItem(key,JSON.stringify({done:true,time:t}))}catch(e){}modal.classList.remove('show');const traceScreen=document.getElementById('traceScreen');if(traceScreen){traceScreen.classList.remove('show');traceScreen.setAttribute('aria-hidden','true')}const flash=document.getElementById('applyFlash');flash.classList.remove('show');void flash.offsetWidth;flash.classList.add('show');setTimeout(()=>{render(t);flash.classList.remove('show')},1000)};</script><script id="trace-screen-script">(()=>{const screen=document.getElementById('traceScreen'),guide=document.getElementById('traceGuide');let tracing=false,last=null,total=0,visited=new Set(),done=false;const norm=a=>(a+Math.PI*2)%(Math.PI*2);function reset(){tracing=false;last=null;total=0;visited.clear();done=false}function point(e){const r=guide.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left-r.width/2,y:t.clientY-r.top-r.height/2,r:r.width/2}}function start(e){const p=point(e);if(Math.hypot(p.x,p.y)>p.r+55)return;tracing=true;last=norm(Math.atan2(p.y,p.x));visited.add(Math.floor(last/(Math.PI*2)*36));e.preventDefault()}function move(e){if(!tracing||done)return;const p=point(e),dist=Math.hypot(p.x,p.y);if(dist>p.r+70)return;const a=norm(Math.atan2(p.y,p.x));let d=a-last;if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;total+=Math.abs(d);last=a;visited.add(Math.floor(a/(Math.PI*2)*36));if(total>=Math.PI*1.1&&visited.size>=12){done=true;tracing=false;setTimeout(()=>{reset();modal.classList.add('show')},150)}e.preventDefault()}function end(){tracing=false}document.getElementById('present').onclick=()=>{document.getElementById('traceTitle').textContent=document.getElementById('title').textContent;document.getElementById('traceDate').textContent=document.getElementById('date').textContent;document.getElementById('traceOpen').textContent=data.open;document.getElementById('traceStart').textContent=data.start;document.getElementById('traceOpenGroup').style.display=data.open?'inline-flex':'none';document.getElementById('traceStartGroup').style.display=data.start?'inline-flex':'none';document.getElementById('traceType').textContent=document.getElementById('type').textContent;reset();screen.classList.add('show');screen.setAttribute('aria-hidden','false')};document.getElementById('traceClose').onclick=()=>{screen.classList.remove('show');screen.setAttribute('aria-hidden','true');reset()};guide.addEventListener('touchstart',start,{passive:false});guide.addEventListener('touchmove',move,{passive:false});guide.addEventListener('touchend',end);guide.addEventListener('mousedown',start);window.addEventListener('mousemove',move);window.addEventListener('mouseup',end)})();</script></body></html>
